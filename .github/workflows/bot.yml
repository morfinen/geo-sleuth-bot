name: geo-sleuth-bot
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geo-sleuth-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Установить Python и uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Клонировать geo-sleuth
        run: git clone --depth 1 https://github.com/Oldcircle/geo-sleuth.git

      - name: Установить зависимости бота
        run: pip install -r requirements.txt

      - name: Установить браузеры для geo-sleuth
        run: uvx playwright install chromium --with-deps

      - name: Запустить бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py

      - name: Сохранить offset
        if: always()
        run: |
          if [ -f offset.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add offset.json
            git commit -m "update offset [skip ci]" || true
            for i in 1 2 3 4 5; do
              git push && exit 0
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep 3
            done
          fi
